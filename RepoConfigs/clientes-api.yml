spring:
  application:
    name: clientes-api

  datasource:
    url: jdbc:mysql://localhost:3306/microservicio_clientes?serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    # Zona horaria de Hibernate/JVM
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

    # SQL
    show-sql: false

    # Dialecto (Para test)
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 9000


# Actuator - habilitar endpoints de estados
  # Info
info:
  app:
    name: Microservicio Clientes
    version: 1.0.0
    description: API de gestion de clientes